<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/>
    </marker>
    <style>
      .cls  { fill:#eef4fb; stroke:#2b2b2b; stroke-width:1.4; }
      .virt { fill:#fdf3e2; stroke:#2b2b2b; stroke-width:1.4; stroke-dasharray:6 3; }
      .ttl  { font-weight:600; text-anchor:middle; }
      .sec  { text-anchor:middle; fill:#3a3a3a; }
      .mem  { text-anchor:start; }
      .ln   { font-weight:600; text-anchor:middle; fill:#8a4b00; font-size:12; }
      .edge { stroke:#2b2b2b; stroke-width:1.4; fill:none; }
      .grp  { fill:none; stroke:#9aa5b1; stroke-width:1; stroke-dasharray:3 3; }
      .cap  { text-anchor:middle; fill:#5b6770; font-size:11; }
    </style>
  </defs>

  <text x="380" y="24" class="ttl" font-size="15">11.I — иерархия классов роботов (UML class diagram)</text>

  <rect x="238" y="44" width="284" height="112" class="cls" rx="3"/>
  <text x="380" y="63" class="ttl">QuadrupedRobot</text>
  <line x1="238" y1="71" x2="522" y2="71" stroke="#2b2b2b" stroke-width="1"/>
  <text x="248" y="88" class="mem">- name : std::string</text>
  <text x="248" y="104" class="mem">- liveCount : int {static}</text>
  <line x1="238" y1="112" x2="522" y2="112" stroke="#2b2b2b" stroke-width="1"/>
  <text x="248" y="129" class="mem">+ QuadrupedRobot(name)</text>
  <text x="248" y="145" class="mem">+ getName() : string · setName(name)</text>

  <rect x="46" y="250" width="284" height="112" class="virt" rx="3"/>
  <text x="188" y="269" class="ttl">CargoRobot</text>
  <line x1="46" y1="277" x2="330" y2="277" stroke="#2b2b2b" stroke-width="1"/>
  <text x="56" y="294" class="mem">- cargoWeight : double</text>
  <line x1="46" y1="302" x2="330" y2="302" stroke="#2b2b2b" stroke-width="1"/>
  <text x="56" y="319" class="mem">+ CargoRobot(cargoWeight, name)</text>
  <text x="56" y="335" class="mem">+ getCargoWeight() · setCargoWeight(w)</text>

  <rect x="430" y="250" width="284" height="112" class="virt" rx="3"/>
  <text x="572" y="269" class="ttl">AutonomousRobot</text>
  <line x1="430" y1="277" x2="714" y2="277" stroke="#2b2b2b" stroke-width="1"/>
  <text x="440" y="294" class="mem">- autonomousRangeKm : double</text>
  <line x1="430" y1="302" x2="714" y2="302" stroke="#2b2b2b" stroke-width="1"/>
  <text x="440" y="319" class="mem">+ AutonomousRobot(rangeKm, name)</text>
  <text x="440" y="335" class="mem">+ getAutonomousRangeKm() · set…(km)</text>

  <rect x="214" y="452" width="332" height="128" class="cls" rx="3"/>
  <text x="380" y="471" class="ttl">CargoAutonomousRobot</text>
  <line x1="214" y1="479" x2="546" y2="479" stroke="#2b2b2b" stroke-width="1"/>
  <text x="224" y="496" class="mem">- announce(what) const : void</text>
  <line x1="214" y1="504" x2="546" y2="504" stroke="#2b2b2b" stroke-width="1"/>
  <text x="224" y="521" class="mem">+ CargoAutonomousRobot(cargo, range, name)</text>
  <text x="224" y="537" class="mem">+ describe() const : void</text>
  <text x="224" y="553" class="mem">+ ~CargoAutonomousRobot()</text>
  <text x="224" y="571" class="cap">виртуальную базу инициализирует сам</text>

  <polyline class="edge" points="188,250 188,196 380,196 380,160" marker-end="url(#hollow)"/>
  <polyline class="edge" points="572,250 572,196 380,196 380,160" marker-end="url(#hollow)"/>
  <line class="edge" x1="188" y1="452" x2="188" y2="362" marker-end="url(#hollow)"/>
  <line class="edge" x1="572" y1="452" x2="572" y2="362" marker-end="url(#hollow)"/>

  <rect x="248" y="196" width="264" height="22" class="grp" rx="3"/>
  <text x="380" y="211" class="ln">«public virtual» — виртуальное наследование</text>
  <text x="150" y="412" class="ln">public</text>
  <text x="608" y="412" class="ln">public</text>

  <text x="380" y="604" class="cap">Пустой треугольник — generalization (наследование). Пунктиром — классы ромба: у них один общий подобъект базы.</text>
</svg>
